<!DOCTYPE html>
<html>
<head>
    <title>Football Tournament</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #111 0%, #000 60%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #000, #111);
            box-shadow: 0 0 12px #00f2ff;
        }

        .navbar-brand {
            font-weight: bold;
            color: #00f2ff !important;
            text-shadow: 0 0 6px #00f2ff;
        }

        .nav-link {
            color: #ccc !important;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #00f2ff !important;
            text-shadow: 0 0 8px #00f2ff;
        }

        .rules-link {
            color: #00f2ff !important;
            font-weight: bold;
            text-shadow: 0 0 8px #00f2ff;
        }

        .card {
            background: linear-gradient(145deg, #1a1a1a, #222);
            border: 1px solid #00f2ff55;
            box-shadow: 0 0 20px #00f2ff33;
            border-radius: 12px;
        }

        h2, h4, h5 {
            color: #00f2ff;
            text-shadow: 0 0 6px #00f2ff;
        }

        /* ✅ TOP 2 QUALIFICATION */
        .qualified-row {
            background-color: rgba(0, 255, 120, 0.15) !important;
            border-left: 4px solid #00ff88;
        }

        /* ✅ COUNTDOWN STYLES */
        .countdown-normal {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffc107;
            text-shadow: 0 0 10px #ffc107;
        }

        .countdown-danger {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff3b3b;
            text-shadow: 0 0 15px #ff0000;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        .deadline-banner {
            background: #ff0000;
            color: white;
            font-weight: bold;
            padding: 8px;
            border-radius: 8px;
            animation: flash 1s infinite alternate;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{{ url_for('main.home') }}">🏆 Tournament</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.home') }}">Groups</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.group_fixtures') }}">Fixtures</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.standings') }}">Standings</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link rules-link" href="{{ url_for('main.rules') }}">Rules</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning" href="{{ url_for('admin.login') }}">Admin</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
